kind = "web"
previewPath = "/"
title = "Cafe Aasaca"
version = "1.0.0"
id = "artifacts/cafe-aasaca"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 26006
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/cafe-aasaca run dev"

[services.env]
PORT = "26006"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/cafe-aasaca", "run", "build"]
publicDir = "artifacts/cafe-aasaca/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
